<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F1E3" />
    <meta name="description" content="Tellus: What is Earth telling us? Ask the planet a question and read 45 years of NASA Earth data like tree rings: what is changing, where, how fast, and whether it is real." />
    <title>Tellus: What is Earth telling us?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      // follow the device; a manual choice counts only while the device still has the setting it was made against
      try {
        var dev = matchMedia('(prefers-color-scheme: dark)').matches ? 'dusk' : 'day', t = dev;
        try { var o = JSON.parse(localStorage.getItem('tellus-theme-override') || 'null'); if (o && o.against === dev && (o.theme === 'day' || o.theme === 'dusk')) t = o.theme; } catch (e) {}
        if (t === 'dusk') document.documentElement.dataset.theme = 'dusk';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
